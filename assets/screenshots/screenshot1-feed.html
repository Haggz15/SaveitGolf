<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SaveitGolf Screenshot 1 - Feed</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Barlow+Condensed:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1284px; height: 2778px; overflow: hidden; background: #0d1f3c; }
  body { font-family: 'Barlow Condensed', sans-serif; }

  .canvas {
    width: 1284px;
    height: 2778px;
    background: #0d1f3c;
    display: flex;
    flex-direction: column;
  }

  .caption-banner {
    width: 100%;
    height: 320px;
    flex-shrink: 0;
    background: #16294d;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 80px;
    color: #ffffff;
    letter-spacing: 1px;
    text-align: center;
  }

  .phone-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone-frame {
    width: 1040px;
    height: 2258px;
    background: #050505;
    border-radius: 110px;
    padding: 16px;
    position: relative;
    box-shadow: 0 60px 120px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.05) inset;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 94px;
    overflow: hidden;
    position: relative;
    background: #0d1f3c;
  }

  .dynamic-island {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 44px;
    background: #000;
    border-radius: 22px;
    z-index: 60;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 56px;
    z-index: 55;
  }
  .status-time { font-weight: 700; font-size: 34px; color: #fff; letter-spacing: 0.5px; }
  .status-icons { display: flex; align-items: center; gap: 12px; }

  /* --- Feed content --- */
  .fairway-bg {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 60px, rgba(0,0,0,0.05) 60px 120px),
      linear-gradient(160deg, #2c5c38 0%, #1f4d2e 35%, #143a20 65%, #0b2414 100%);
  }
  .fairway-vignette-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }
  .fairway-vignette-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 52%;
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
  }

  .top-left-info {
    position: absolute;
    top: 148px;
    left: 56px;
    z-index: 40;
  }
  .course-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 42px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    max-width: 640px;
  }
  .hole-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 28px;
    color: rgba(255,255,255,0.88);
    margin-top: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .top-right-logo {
    position: absolute;
    top: 140px;
    right: 56px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-ball {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #f4f5f7;
    border: 2px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .logo-ball svg { width: 34px; height: 34px; }
  .logo-wordmark {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 26px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .logo-wordmark .golf { color: #ff4d5e; }

  .action-rail {
    position: absolute;
    right: 44px;
    bottom: 560px;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 46px;
  }
  .rail-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rail-item svg { filter: drop-shadow(0 3px 8px rgba(0,0,0,0.55)); }
  .rail-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .rail-saveit {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 40px;
    color: #4dd860;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .bottom-left {
    position: absolute;
    left: 52px;
    right: 260px;
    bottom: 200px;
    z-index: 40;
  }
  .user-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .avatar-circle {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 3px solid #ffffff;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  .username {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 32px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .caption-text {
    margin-top: 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 500;
    font-size: 30px;
    color: #f2f4f8;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .state-badge {
    position: absolute;
    right: 52px;
    bottom: 200px;
    z-index: 40;
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(13,31,60,0.65);
    border: 1.5px solid rgba(255,255,255,0.4);
    backdrop-filter: blur(2px);
  }
  .state-badge span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: #ffffff;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="caption-banner">
      <div class="caption-title">Share Your Shots</div>
    </div>

    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="fairway-bg"></div>
          <div class="fairway-vignette-top"></div>
          <div class="fairway-vignette-bottom"></div>

          <div class="dynamic-island"></div>
          <div class="status-bar">
            <div class="status-time">9:41</div>
            <div class="status-icons">
              <svg width="34" height="22" viewBox="0 0 34 22" fill="none">
                <rect x="0" y="14" width="6" height="8" rx="1.5" fill="white"/>
                <rect x="9" y="10" width="6" height="12" rx="1.5" fill="white"/>
                <rect x="18" y="6" width="6" height="16" rx="1.5" fill="white"/>
                <rect x="27" y="2" width="6" height="20" rx="1.5" fill="white"/>
              </svg>
              <svg width="30" height="22" viewBox="0 0 30 22" fill="none">
                <circle cx="15" cy="18" r="2.4" fill="white"/>
                <path d="M9 13c3.3-3 8.7-3 12 0" stroke="white" stroke-width="2.6" stroke-linecap="round" fill="none"/>
                <path d="M4 8c6-5.3 16-5.3 22 0" stroke="white" stroke-width="2.6" stroke-linecap="round" fill="none"/>
              </svg>
              <svg width="50" height="24" viewBox="0 0 50 24" fill="none">
                <rect x="1" y="1" width="40" height="22" rx="5" stroke="white" stroke-width="2" fill="none" opacity="0.45"/>
                <rect x="4" y="4" width="34" height="16" rx="3" fill="white"/>
                <rect x="43" y="8" width="4" height="8" rx="2" fill="white" opacity="0.45"/>
              </svg>
            </div>
          </div>

          <div class="top-left-info">
            <div class="course-name">Elmhurst Country Club</div>
            <div class="hole-label">Hole 7</div>
          </div>

          <div class="top-right-logo">
            <div class="logo-ball">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#f4f5f7" stroke="#b7bcc4" stroke-width="0.5"/>
                <circle cx="9" cy="9" r="0.8" fill="#c9ccd2"/>
                <circle cx="12" cy="8" r="0.8" fill="#c9ccd2"/>
                <circle cx="15" cy="9" r="0.8" fill="#c9ccd2"/>
                <circle cx="9" cy="12" r="0.8" fill="#c9ccd2"/>
                <circle cx="12" cy="12" r="0.8" fill="#c9ccd2"/>
                <circle cx="15" cy="12" r="0.8" fill="#c9ccd2"/>
                <circle cx="9" cy="15" r="0.8" fill="#c9ccd2"/>
                <circle cx="12" cy="16" r="0.8" fill="#c9ccd2"/>
                <circle cx="15" cy="15" r="0.8" fill="#c9ccd2"/>
              </svg>
            </div>
          </div>

          <div class="action-rail">
            <div class="rail-item">
              <svg width="58" height="58" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="0">
                <path d="M12 21s-6.7-4.35-9.3-8.1C.9 10.2 1.6 6.4 4.7 4.9c2.4-1.15 5-.3 6.3 1.7 1.3-2 3.9-2.85 6.3-1.7 3.1 1.5 3.8 5.3 2 8.0C18.7 16.65 12 21 12 21z"/>
              </svg>
              <div class="rail-count">428</div>
            </div>
            <div class="rail-item">
              <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
              </svg>
              <div class="rail-count">36</div>
            </div>
            <div class="rail-item">
              <div class="rail-saveit">Save it</div>
            </div>
          </div>

          <div class="bottom-left">
            <div class="user-row">
              <img class="avatar-circle" src="../post.5.jpg" alt="">
              <div class="username">@haggz21</div>
            </div>
            <div class="caption-text">Pure drive on 7 today ⛳</div>
          </div>

          <div class="state-badge"><span>PA</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
