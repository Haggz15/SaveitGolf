[build]
  command = "expo export --platform web && cp public/privacy.html dist/privacy.html && cp public/terms.html dist/terms.html && cp public/support.html dist/support.html"
  publish = "dist"

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
